name: CI & Deployment Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Validate static assets & links
        run: pnpm run test:assets

      - name: Run automated portfolio test suite
        run: pnpm run test:portfolio

      - name: Verify JavaScript syntax & node parse
        run: node -c portfolio-site/main.js

      - name: Verify HTML standards
        run: npx --yes html-validate "portfolio-site/**/*.html" || echo "HTML validation completed"

      - name: Security audit
        run: pnpm audit --audit-level=high || true

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./portfolio-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
