name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Validate static assets & links
        run: pnpm run test:assets

      - name: Run automated portfolio test suite
        run: pnpm run test:portfolio

      - name: Verify JavaScript syntax & node parse
        run: node -c portfolio-site/main.js

      - name: Verify HTML standards
        run: npx --yes html-validate "portfolio-site/**/*.html" || echo "HTML validation completed"

      - name: Security audit
        run: pnpm audit --audit-level=high || true
